<text x="360.0" y="455" text-anchor="middle" font-size="12" font-weight="600" fill="#1a237e">使用示例 (Typical case)</text>
<text x="360.0" y="478" text-anchor="middle" font-size="11" fill="#444">假设患者: P053 (非事件) | DV=9.59 → 66 pts | MV=1.081×10⁶ → 91 pts | Total=157 pts → P(Grade≥2 WBC↓) ≈ 43.4%</text>
<text x="360.0" y="510" text-anchor="middle" font-size="11" fill="#666">β 系数 (z-score 标准化后): β0 = -1.555, βDV = -0.468, βMV = -1.167</text>
<text x="360.0" y="528" text-anchor="middle" font-size="10" fill="#888">标准化参数: DV μ=10.225, σ=1.967 | MV μ=1292587, σ=217217</text>
<rect x="40" y="550" width="640" height="120" fill="#fff3e0" stroke="#ffb74d" stroke-width="1" rx="4"/>
<text x="55" y="572" font-size="12" font-weight="700" fill="#e65100">⚠ 局限性 (Limitations)</text>
<text x="55" y="595" font-size="10" fill="#333">• 样本量小 (n=60, 事件 15), LASSO 约束使模型骨架仅 2 特征, 但 EPV=7.5 仍偏紧</text>
<text x="55" y="609" font-size="10" fill="#333">• 内部 Bootstrap 乐观校正 (B=500): 表观 AUC 0.793 → 校正 AUC 0.695 (optimism=0.098)</text>
<text x="55" y="623" font-size="10" fill="#333">• 缺乏外部验证: UCLA 同题研究 (152 例, AUC 0.71-0.77) 可作锚点但人群/方案不同</text>
<text x="55" y="637" font-size="10" fill="#333">• 影像组学特征依赖 PyRadiomics 提取参数 (bin width/归一化), 跨中心可复现性待证</text>
<text x="55" y="651" font-size="10" fill="#333">• 仅做"是否发生"二分类, 未区分严重程度 (Grade 2/3) 与时间-事件终点 (kinetics)</text>
<text x="55" y="665" font-size="10" fill="#333">• Nomogram 的概率刻度基于 60 例样本 LP 实际范围, 外推时需谨慎</text>
</svg>